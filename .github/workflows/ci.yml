name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FreeCAD isn't a normal pip package - it's tested against the real,
      # official Linux AppImage FreeCAD itself publishes on its GitHub
      # releases (extracted rather than run directly, since --appimage-extract
      # doesn't need FUSE, which CI runners don't have). Cache the *extracted*
      # tree (not just the download) so a cache hit skips extraction and the
      # pip-install step below too, not just the network fetch.
      - name: Cache extracted FreeCAD
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: squashfs-root
          key: freecad-1.1.3-linux-x86_64-extracted-v2

      - name: Download and extract FreeCAD AppImage
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          curl -fL -o freecad.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
          chmod +x freecad.AppImage
          ./freecad.AppImage --appimage-extract >/dev/null
          rm freecad.AppImage

      - name: Locate freecadcmd
        id: locate
        run: |
          FREECADCMD=$(find squashfs-root -type f -name 'freecadcmd' | head -1)
          if [ -z "$FREECADCMD" ]; then
            echo "::error::freecadcmd not found in extracted AppImage"
            find squashfs-root -maxdepth 3
            exit 1
          fi
          echo "freecadcmd=$FREECADCMD" >> "$GITHUB_OUTPUT"

      # Asks FreeCAD's own embedded interpreter for its own sys.executable
      # rather than guessing a bin/ path - the AppImage's internal layout
      # isn't part of any stable public contract, so this stays correct
      # even if it changes between FreeCAD versions.
      - name: Locate FreeCAD's embedded Python interpreter
        id: pyloc
        run: |
          echo "import sys; print('PYEXE=' + sys.executable)" > _locate_python.py
          OUT=$("${{ steps.locate.outputs.freecadcmd }}" _locate_python.py)
          echo "$OUT"
          PYEXE=$(echo "$OUT" | grep '^PYEXE=' | cut -d= -f2-)
          rm _locate_python.py
          echo "pyexe=$PYEXE" >> "$GITHUB_OUTPUT"

      # The vendored openskp package needs these to even import (mapbox_earcut
      # + numpy are eager imports in _core.py; shapely is a lazy fallback path)
      # - not a compiled extension of this addon's own, so a normal pip install
      # into FreeCAD's own embedded interpreter is enough.
      - name: Install openskp's runtime dependencies
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: ${{ steps.pyloc.outputs.pyexe }} -m pip install --quiet mapbox_earcut shapely numpy

      - name: Run import tests
        run: ${{ steps.locate.outputs.freecadcmd }} tests/test_import.py

      - name: Run export tests
        run: ${{ steps.locate.outputs.freecadcmd }} tests/test_export.py
