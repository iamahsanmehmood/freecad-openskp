name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FreeCAD isn't a normal pip package - it's tested against the real,
      # official Linux AppImage FreeCAD itself publishes on its GitHub
      # releases (extracted rather than run directly, since --appimage-extract
      # doesn't need FUSE, which CI runners don't have). Cache the *extracted*
      # tree (not just the download) so a cache hit skips extraction and the
      # pip-install step below too, not just the network fetch.
      - name: Cache extracted FreeCAD
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: squashfs-root
          key: freecad-1.1.3-linux-x86_64-extracted-v2

      - name: Download and extract FreeCAD AppImage
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          curl -fL -o freecad.AppImage \
            https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
          chmod +x freecad.AppImage
          ./freecad.AppImage --appimage-extract >/dev/null
          rm freecad.AppImage

      - name: Locate freecadcmd
        id: locate
        run: |
          FREECADCMD=$(find squashfs-root -type f -name 'freecadcmd' | head -1)
          if [ -z "$FREECADCMD" ]; then
            echo "::error::freecadcmd not found in extracted AppImage"
            find squashfs-root -maxdepth 3
            exit 1
          fi
          echo "freecadcmd=$FREECADCMD" >> "$GITHUB_OUTPUT"

      # `freecadcmd` reports its OWN path as sys.executable (confirmed by
      # running it) - it's a custom launcher, not a python.exe stand-in, so
      # it doesn't understand "-m pip" at the shell level ("unrecognised
      # option '-m'"). Calling pip's own internal API from inside a script
      # freecadcmd runs works around that without needing a second, separate
      # python binary that may or may not exist at a guessable path.
      #
      # The vendored openskp package needs these to even import
      # (mapbox_earcut + numpy are eager imports in _core.py; shapely is a
      # lazy fallback path) - not a compiled extension of this addon's own,
      # so pip into FreeCAD's embedded interpreter is enough.
      - name: Install openskp's runtime dependencies
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          cat > _pip_install.py <<'PYEOF'
          from pip._internal.cli.main import main as _pip_main
          raise SystemExit(_pip_main(["install", "--quiet", "mapbox_earcut", "shapely", "numpy"]))
          PYEOF
          ${{ steps.locate.outputs.freecadcmd }} _pip_install.py
          rm _pip_install.py

      - name: Run import tests
        run: ${{ steps.locate.outputs.freecadcmd }} tests/test_import.py

      - name: Run export tests
        run: ${{ steps.locate.outputs.freecadcmd }} tests/test_export.py

      - name: Run non-planar face regression tests
        run: ${{ steps.locate.outputs.freecadcmd }} tests/test_nonplanar.py

      - name: Run component hierarchy tests
        run: ${{ steps.locate.outputs.freecadcmd }} tests/test_hierarchy.py

      - name: Run solids option tests
        run: ${{ steps.locate.outputs.freecadcmd }} tests/test_solids.py

      - name: Run assemblies option tests
        run: ${{ steps.locate.outputs.freecadcmd }} tests/test_assemblies.py

      - name: Run curved surfaces option tests
        run: ${{ steps.locate.outputs.freecadcmd }} tests/test_curved_surfaces.py

      - name: Run textured materials feasibility probe
        run: ${{ steps.locate.outputs.freecadcmd }} tests/test_texture_feasibility.py

      # The tests above call the importer directly, so none of them can tell whether
      # FreeCAD registers the .skp types by itself at startup (#14). This one starts a
      # fresh freecadcmd whose user data directory holds an installed copy of the add-on
      # (the repository's files, as the Addon Manager would install them) and asks what
      # FreeCAD registered.
      - name: Run startup registration test
        run: |
          export FREECAD_USER_DATA="$RUNNER_TEMP/freecad-user"
          mkdir -p "$FREECAD_USER_DATA/Mod/OpenSKP"
          git archive HEAD | tar -x -C "$FREECAD_USER_DATA/Mod/OpenSKP"
          ${{ steps.locate.outputs.freecadcmd }} tests/test_registration.py

  # The component hierarchy in FreeCAD's real GUI, under a virtual display: what the 3D
  # view actually draws (links to hidden definitions, a hidden tag, definitions kept out
  # of view), which the headless tests above cannot see. Screenshots are uploaded.
  gui:
    name: GUI check (hierarchy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache extracted FreeCAD
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: squashfs-root
          key: freecad-1.1.3-linux-x86_64-extracted-v2

      - name: Download and extract FreeCAD AppImage
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          curl -fL -o freecad.AppImage             https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
          chmod +x freecad.AppImage
          ./freecad.AppImage --appimage-extract >/dev/null
          rm freecad.AppImage

      - name: Install openskp's runtime dependencies
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          FREECADCMD=$(find squashfs-root -type f -name 'freecadcmd' | head -1)
          cat > _pip_install.py <<'PYEOF'
          from pip._internal.cli.main import main as _pip_main
          raise SystemExit(_pip_main(["install", "--quiet", "mapbox_earcut", "shapely", "numpy"]))
          PYEOF
          "$FREECADCMD" _pip_install.py
          rm _pip_install.py

      - name: Install a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0             libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-image0 libxcb-xinerama0 >/dev/null

      - name: Run the GUI check
        run: |
          export GUI_OUT="$RUNNER_TEMP/gui-out" GUI_TESTS_DIR="$GITHUB_WORKSPACE/tests"
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 300 squashfs-root/AppRun             "$GITHUB_WORKSPACE/tests/gui_hierarchy.py" || true
          if [ ! -f "$GUI_OUT/result.txt" ]; then echo "::error::the GUI check wrote no result"; exit 1; fi
          cat "$GUI_OUT/result.txt"
          head -1 "$GUI_OUT/result.txt" | grep -qx PASS

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-hierarchy
          path: ${{ runner.temp }}/gui-out/*.png
          if-no-files-found: warn

  # The same startup check on FreeCAD 1.1.4, the version #14 was reported on. Startup
  # handling of package.xml differs between FreeCAD releases, so the add-on is checked on
  # more than the one version the tests above run on. A separate job, not a matrix, so the
  # required check name "test" stays what it is.
  registration-1-1-4:
    name: registration (FreeCAD 1.1.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache extracted FreeCAD
        id: cache-freecad
        uses: actions/cache@v4
        with:
          path: squashfs-root
          key: freecad-1.1.4-linux-x86_64-extracted-v1

      - name: Download and extract FreeCAD AppImage
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          curl -fL -o freecad.AppImage             https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          chmod +x freecad.AppImage
          ./freecad.AppImage --appimage-extract >/dev/null
          rm freecad.AppImage

      - name: Locate freecadcmd
        id: locate
        run: |
          FREECADCMD=$(find squashfs-root -type f -name 'freecadcmd' | head -1)
          if [ -z "$FREECADCMD" ]; then
            echo "::error::freecadcmd not found in extracted AppImage"
            exit 1
          fi
          echo "freecadcmd=$FREECADCMD" >> "$GITHUB_OUTPUT"

      - name: Install openskp's runtime dependencies
        if: steps.cache-freecad.outputs.cache-hit != 'true'
        run: |
          cat > _pip_install.py <<'PYEOF'
          from pip._internal.cli.main import main as _pip_main
          raise SystemExit(_pip_main(["install", "--quiet", "mapbox_earcut", "shapely", "numpy"]))
          PYEOF
          ${{ steps.locate.outputs.freecadcmd }} _pip_install.py
          rm _pip_install.py

      - name: Run startup registration test
        run: |
          export FREECAD_USER_DATA="$RUNNER_TEMP/freecad-user"
          mkdir -p "$FREECAD_USER_DATA/Mod/OpenSKP"
          git archive HEAD | tar -x -C "$FREECAD_USER_DATA/Mod/OpenSKP"
          ${{ steps.locate.outputs.freecadcmd }} tests/test_registration.py
